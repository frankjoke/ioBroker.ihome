<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="House controller">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10a0ea" />
      <stop offset="1" stop-color="#0165a8" />
    </linearGradient>
  </defs>

  <!-- rounded tile -->
  <rect x="8" y="8" width="184" height="184" rx="44" fill="url(#tile)" />

  <!-- house: gabled roof with eaves + body -->
  <path d="M100 36 L172 102 H28 Z" fill="#ffffff" />
  <rect x="50" y="102" width="100" height="74" fill="#ffffff" />

  <!-- controller toggle switch (the door) -->
  <rect x="88" y="124" width="24" height="44" rx="12" fill="#0b4d84" />
  <circle cx="100" cy="140" r="10" fill="#ffffff" />

  <!-- status LED in the gable -->
  <circle cx="100" cy="66" r="10" fill="#28a745" opacity="0.25" />
  <circle cx="100" cy="66" r="6" fill="#28a745" />
</svg>
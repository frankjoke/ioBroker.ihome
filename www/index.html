		<!-- Apply persisted theme before first paint to avoid a flash -->
		<script>
			(function () {
				try {
					var mode = localStorage.getItem("__VISUAL__:theme");
					mode = mode ? JSON.parse(mode) : "auto";
					var dark;
					if (mode === "dark") {
						dark = true;
					} else if (mode === "light") {
						dark = false;
					} else {
						// Auto: the admin's own theme (same origin), then the OS.
						var admin = localStorage.getItem("App.themeName");
						if (admin && admin !== "auto") {
							dark =
								["dark", "blue", "modernDark"].indexOf(admin) !== -1;
						} else {
							dark = window.matchMedia(
								"(prefers-color-scheme: dark)",
							).matches;
						}
					}
					if (dark) document.documentElement.classList.add("dark");
				} catch (e) {
					/* ignore */
				}
			})();
		</script>

ційного керування телевізора Samsung: ущільніть кнопки Home/Zurück/Info та перемістіть статус з\'єднання в заголовок.","zh-cn":"三星电视遥控器：压缩 Home/Zurück/Info 按钮，然后将连接状态移至标题中。"},"0.3.0":{"en":"Plugins: a plugin API with `network.info`/`network.wake`, network device presence monitoring and the Samsung TV remote bundle. Device templates: JavaScript API templates (`readRequest`/`writeRequest`) with generated states and polling/write logic, user templates, the built-in meter template, and applying a template creates or updates the device in place. Logic: object output, async `fetchJson` tasks and editor refinements. UI: the apply dialog opens the generated device or logic, re-applying keeps one generated logic, a section title selects its section, Custom-device tiles take the first control\'s icon, and frame/HTML URLs work in dev, on the LAN and through ioBroker Pro (`{{origin}}`/`{{base}}`/`//path`).","de":"Plugins: eine Plugin-API mit `network.info`/`network.wake`, Anwesenheitskontrolle und Samsung TV Remote Bundle. Gerätevorlagen: JavaScript-API-Vorlagen (`ReadRequest`/`WriteRequest`) mit generierten Zuständen und Abfrage-/Schreiblogik, Benutzervorlagen, Zählervorlage. Durch Anwenden einer Vorlage wird das Gerät erstellt oder aktualisiert. Logik: Objektausgabe, asynchrone `fetchJSON`-Aufgaben und Editor. UI: Der Anwenden-Dialog öffnet das generierte Gerät oder die generierte Logik, ein Abschnittstitel wählt seinen Abschnitt aus, Gerätekacheln nehmen das erste Steuersymbol an und Frame/HTML-URLs funktionieren in dev, im LAN und über ioBroker Pro (`{{origin}} `/` {{base}}","ru":"Плагины: API плагинов с `network.info`/`network.wake`, мониторингом присутствия сетевых устройств и комплектом пульта дистанционного управления Samsung TV. Шаблоны устройств: шаблоны JavaScript API (`ReadRequest`/ `WriteRequest`) с генерируемыми состояниями и логикой опроса и записи, пользовательские шаблоны, встроенный шаблон измерителя, а применение шаблона позволяет создать или обновить устройство на месте. Логика: вывод объектов, асинхронные задачи `fetchJSON` и доработки редактора. Пользовательский интерфейс: диалоговое окно подачи заявки открывает сгенерированное устройство или логику, повторное применение сохраняет одну сгенерированную логику, заголовок раздела выбирает соответствующий раздел, плитки пользовательских устройств занимают значок первого элемента управления, а URL-адреса фрейма/HTML работают в разработчике, в локальной сети и через IOBroker Pro (`{{origin}} `/` {base}} `/`//path`).","pt":"Plugins: uma API de plug-in com `network.info`/`network.wake`, monitoramento de presença de rede e pacote remoto de TV Samsung. Modelos de API JavaScript (`readRequest`/`writeRequest`) com estados gerados e lógica de sondagem/escrita, modelos de usuário, o modelo de medidor embutido e a aplicação de um modelo cria ou atualiza o dispositivo. Lógica: saída de objeto, tarefas assíncronas e editor. UI: a caixa de diálogo abre o dispositivo ou a lógica gerada, a reaplicação mantém uma lógica gerada, o título da seção seleciona a seção, os blocos personalizados pegam o ícone do primeiro controle e os URLs frame/HTML funcionam em dev, na LAN e através do IOBroker Pro (`{{origin}} `/` {origin}} `/`//path`).","nl":"Plug-ins: een plug-in-API met `network.info`/`network.wake`, aanwezigheidsbewaking van netwerkapparaten en de externe bundel van Samsung TV. Apparaatsjablonen: JavaScript-API-sjablonen (`ReadRequest`/`WriteRequest`) met gegenereerde statussen en polling-/schrijflogica, gebruikerssjablonen, het ingebouwde metersjabloon, en als u een sjabloon toepast, wordt het apparaat op zijn plaats gemaakt of bijgewerkt. Logica: uitvoer van objecten, asynchrone \'FetchJSON\'-taken en verfijningen van de editor. Gebruikersinterface: in het dialoogvenster Toepassen wordt het gegenereerde apparaat of de gegenereerde logica geopend, bij opnieuw toepassen blijft één gegenereerde logica behouden, een sectietitel selecteert de sectie, aangepaste apparaattegels nemen het pictogram van het eerste besturingselement over, en Frame/HTML-URL\'s werken in dev, op het LAN en via ioBroker Pro (`{{origin}} `/` {base}} `///path`).","fr":"Plugins : un plugin API avec « network.info`/`network.wake », la surveillance de la présence des appareils réseau et le pack de télécommandes Samsung TV. Modèles d\'appareils : modèles d\'API JavaScript (`ReadRequest`/`WriteRequest`) avec états générés et logique d\'écriture, modèles utilisateur, modèle de compteur intégré, et l\'application d\'un modèle crée ou met à jour l\'appareil en place. Logique : sortie d\'objets, tâches asynchrones « FetchJSON » et éditeur amélioré. Interface utilisateur : la boîte de dialogue ouvre l\'appareil ou la logique générée, la réapplication conserve une logique générée, le titre d\'une section sélectionne sa section, les vignettes personnalisées prennent l\'icône du premier contrôle et les URL Frame/HTML fonctionnent en développement, sur le LAN et via IObroker Pro (`{{origin}} `/` {{base}} `/`//path`).","it":"Plugin: un\'API plugin con `network.info`/`network.wake`, monitoraggio della presenza dei dispositivi e TV Samsung. Modelli di dispositivo: modelli API JavaScript (ReadRequest`/`WriteRequest`) con stati generati e logica di polling/write, modelli utente, modello di contatore integrato e l\'applicazione di un modello crea o aggiorna il dispositivo. Logica: output di oggetti, task fetchJSON asincroni e editor. Interfaccia utente: la finestra di dialogo Applica apre il dispositivo o la logica generata, la riapplicazione mantiene una logica generata, i riquadri personalizzati del dispositivo occupano l\'icona del primo controllo e gli URL Frame/HTML funzionano in dev, sulla LAN e tramite IOBroker Pro.","es":"Plugins: una API de plugins con `network.info`/`network.wake`, monitorización de presencia de dispositivos de red y el paquete Samsung TV Remote. Plantillas de dispositivos: plantillas de API de JavaScript (`ReadRequest`/`writeRequest`) con estados generados y lógica de sondeo y escritura, plantillas de usuario, plantilla de contadores integrada y al aplicar una plantilla, se crea o actualiza el dispositivo en su lugar. Lógica: salida de objetos, tareas asíncronas de FetchJSON y ajustes de editor. Interfaz de usuario: el cuadro de diálogo de aplicación abre el dispositivo o la lógica generada, al volver a aplicar se conserva una lógica generada, el título de una sección selecciona su sección, los mosaicos del dispositivo personalizado toman el icono del primer control y las URL Frame/HTML funcionan en dev, en la LAN y a través de IOBroker Pro (`{{origin}} `/`//path`).","pl":"Wtyczki: interfejs API wtyczki z `network.info`/`network.wake`, monitorowaniem obecności urządzeń sieciowych i pakietem zdalnego sterowania Samsung TV. Szablony urządzeń: Szablony interfejsu API JavaScript (`ReadRequest`/`WriteRequest`) z wygenerowanymi stanami i logiką zapytania/zapisu, szablony użytkownika, wbudowany szablon licznika i zastosowanie szablonu tworzy lub aktualizuje urządzenie na miejscu. Logika: wyjście obiektów, zadania asynchroniczne `fetchJSON` i udoskonalenia edytora. Interfejs użytkownika: okno dialogowe aplikacji otwiera wygenerowane urządzenie lub logikę, ponowne zastosowanie zachowuje jedną wygenerowaną logikę, tytuł sekcji wybiera sekcję, kafelki urządzenia niestandardowego przejmują ikonę pierwszej kontrolki, a adresy Frame/HTML działają w dev, w sieci LAN i przez ioBroker Pro (`{{origin}} `/`//path`).","uk":"Плагіни: API плагінів з `network.info`/`network.wake`, моніторинг присутності мережевих пристроїв та комплект дистанційного керування Samsung TV. Шаблони пристроїв: шаблони API JavaScript (`ReadRequest`/`WriteRequest`) зі згенерованими станами та логікою опитування/запису, шаблони користувачів, вбудований шаблон лічильника та застосування шаблону створює або оновлює пристрій на місці. Логіка: виведення об\'єкта, асинхронні завдання `FetchJson` та уточнення редактора. Інтерфейс користувача: діалогове вікно застосування відкриває згенерований пристрій або логіку, повторне застосування зберігає одну згенеровану логіку, заголовок розділу вибирає його розділ, плитки Custom-device приймають значок першого елемента керування, а URL-адреси фрейму/HTML працюють у dev, на локальній мережі та через ioBroker Pro (`{{origin}} `/` {{base}} `/`//path`).","zh-cn":"插件：带有 “network.info`/network.wake”、网络设备状态监控和三星电视遥控器套装的插件 API。设备模板：带有生成状态和轮询/写入逻辑的 JavaScript API 模板（`ReadRequest`/`WriteRequest`）、用户模板、内置仪表模板以及应用模板可在原地创建或更新设备。逻辑：对象输出、异步 `fetchJSON`任务和编辑器优化。用户界面：应用对话框打开生成的设备或逻辑，重新应用会保留一个生成的逻辑，章节标题选择其分区，自定义设备图块使用第一个控件的图标，框架/HTML 网址在开发中、局域网和通过 ioBroker Pro 运行（`{{origin}} `/`//path`）。"},"0.1.4":{"en":"Logic v1 grows up: an event combines state sources with repeating timers (an interval, a SunCalc astro time from the system location with a minute offset, or cron HH:MM[:SS] on selected weekdays), $logic.<id> triggers another logic, $var.<name> listens to a global variable, $all and $start are pseudo-states, and startup adopts the current state silently instead of replaying it. The timer type is the app\'s tab strip and all weekdays start checked; the tile editor adds a value/name home, rule lists, an inline device editor and a tabbed source picker with variables and logic.","de":"Logik v1 wächst: Ein Event kombiniert State-Quellen mit wiederkehrenden Timern (Intervall, SunCalc-Astrozeit aus dem System-Standort mit Minuten-Offset oder Cron HH:MM[:SS] an ausgewählten Wochentagen), $logic.<id> stößt eine andere Logik an, $var.<name> hört auf eine globale Variable, $all und $start sind Pseudo-States, und der Start übernimmt den aktuellen Zustand still statt ihn nachzuspielen. Der Timer-Typ ist die Tab-Leiste der App und alle Wochentage sind vorausgewählt; der Kachel-Editor ergänzt eine Wert-/Namens-Ansicht, Regellisten, einen eingebetteten Geräte-Editor und einen getabbten Quellen-Picker mit Variablen und Logik."},"0.1.3":{"en":"Device controls can now correct a badly decorated state: role, type, value labels (states), unit and hide-unit, min/max/step, read/write, room and functions. The correction wins over the broker object and drives the widget choice, value formatting, badges, device list and slot creation. Both selectors filter by room and function (the device picker also by name/control), every slot kind has its own icon, the tile has a separate icon before its name, duplicate control labels are numbered, and deleting a slot or tile asks first.","de":"Geräte-Controls können einen schlecht dekorierten State jetzt korrigieren: Rolle, Typ, Wertelabels (states), Einheit und Einheit ausblenden, Min/Max/Step, Lesen/Schreiben, Raum und Funktionen. Die Korrektur gewinnt über das Broker-Objekt und steuert Widget-Wahl, Wertformatierung, Badges, Geräteliste und Slot-Erzeugung. Beide Auswahlen filtern nach Raum und Funktion (die Geräteauswahl auch nach Name/Control), jeder Slot-Typ hat sein eigenes Icon, die Kachel hat ein eigenes Icon vor ihrem Namen, doppelte Control-Namen werden nummeriert, und das Löschen eines Slots oder einer Kachel fragt vorher nach."},"0.1.2":{"en":"A phone is now a narrow desktop: tiles keep their configured width and height (clamped only to the screen), sections wrap side by side instead of one per line, and the phone module is larger so names and values stop wrapping. HTML/frame slots show their icon and label as a caption above the surface and fill the whole tile, and a phone trims its margins so five 1×1 tiles fit per row from 408 px.","de":"Ein Handy ist jetzt ein schmaler Desktop: Kacheln behalten ihre eingestellte Breite und Höhe (nur auf den Bildschirm begrenzt), Bereiche umbrechen nebeneinander statt einer pro Zeile, und das Handy-Modul ist größer, damit Namen und Werte nicht mehr umbrechen. HTML-/Frame-Slots zeigen Icon und Label als Überschrift über der Fläche und füllen die ganze Kachel; ein Handy spart Ränder, sodass ab 408 px fünf 1×1-Kacheln pro Zeile passen."},"0.1.1":{"en":"HTML slots: a tile can carry a full local HTML document — scripts, styles and same-origin access — inline or from a state, shown on its detail page. {{NAME}} placeholders read Global Variables or raw states, and the document can call ihome.setState/getState/setVariable/getVariable. Includes the usual icon/label basics, slot labels above pages and a light Samsung remote sample.","de":"HTML-Slots: Eine Kachel kann ein vollständiges lokales HTML-Dokument tragen — Skripte, Styles und Same-Origin-Zugriff — inline oder aus einem State, angezeigt auf ihrer Detailseite. {{NAME}}-Platzhalter lesen Globale Variablen oder Roh-States, und das Dokument kann ihome.setState/getState/setVariable/getVariable aufrufen. Enthält die üblichen Icon-/Label-Grundlagen, Slot-Labels über Seiten und ein helles Samsung-Remote-Beispiel."},"0.1.0":{"en":"One picker for every state or control selection: the same modal adds a slot, picks a tile\'s active source, edits device controls or a variable, and lists the tile\'s own sources first. The layout editor keeps the selected tile across view/edit, moves tiles and sections through dialogs, reorders pages, and can hide the pencil for everyone. The mobile bar drops the network icon (the cog shows the connection) and page-tab icons on narrow screens; the theme choice now lives in User Interface and stays per browser.","de":"Ein Picker für jede State- oder Control-Auswahl: Dasselbe Fenster legt einen Slot an, wählt die aktive Quelle einer Kachel, bearbeitet Geräte-Controls oder eine Variable und zeigt die Quellen der Kachel zuerst. Der Layout-Editor behält die gewählte Kachel über Ansicht/Editor, verschiebt Kacheln und Bereiche per Dialog, ordnet Seiten um und kann den Stift für alle ausblenden. Die mobile Leiste verliert das Netzwerk-Icon (das Zahnrad zeigt die Verbindung) und auf schmalen Bildschirmen die Seiten-Icons; die Theme-Wahl liegt jetzt unter Benutzeroberfläche und bleibt pro Browser."}},"titleLang":{"en":"iHome","de":"iHome","ru":"iHome","pt":"iHome","nl":"iHome","fr":"iHome","it":"iHome","es":"iHome","pl":"iHome   <div id="pad">
    <button id="power">Power</button>
    <button data-key="KEY_HOME" class="small">Home</button>
    <button data-key="KEY_RETURN" class="small">Zurück</button>

    <button data-key="KEY_UP" class="round">▲</button>

    <button data-key="KEY_RIGHT" class="round">▶</button>

<script>
  const NAME = btoa("opencode-remote"); // derselbe Name, den der TV kennt
  const WAKE_DEVICE = "{{wakeDevice}}";
  let ws = null;
  const $status = document.getElementById("status");
  const setStatus = (t, cls = "") => { $status.textContent = t; $status.className = cls; };
  const host = () => document.getElementById("host").value.trim();

  // Ein Verbindungsversuch: löst auf, sobald der TV ms.channel.connect schickt.
  function openSocket(timeout = 8000) {
    return new Promise((resolve, reject) => {
      const url = \`ws://\${host()}:8001/api/v2/channels/samsung.remote.control?name=\${encodeURIComponent(NAME)}\`;
      const s = new WebSocket(url);
      const timer = setTimeout(() => { s.close(); reject(new Error("TV antwortet nicht (an?)")); }, timeout);
      s.onopen = () => setStatus("Handshake … am TV ggf. bestätigen");
      s.onerror = () => { clearTimeout(timer); reject(new Error("keine Verbindung – TV an, gleiches WLAN?")); };
      s.onclose = () => { clearTimeout(timer); reject(new Error("Verbindung getrennt")); };
      s.onmessage = (e) => {
        const m = JSON.parse(e.data);
        if (m.event === "ms.channel.connect") {
          clearTimeout(timer);
          ws = s;
          s.onclose = () => { ws = null; setStatus("Verbindung getrennt"); };
          setStatus("verbunden mit " + host(), "ok");
          resolve(s);
        } else if (m.event === "ms.channel.unauthorized") {
          clearTimeout(timer); s.close();
          reject(new Error("TV hat abgelehnt – Geräteliste am TV prüfen"));
        } else if (m.event === "ms.channel.timeOut") {
          clearTimeout(timer); s.close();
          reject(new Error("TimeOut – am TV „Zulassen“ drücken"));
        } else if (m.event === "ed.installedApp.get") {
          const apps = m.data?.data ?? m.data ?? [];
          setStatus(\`OK – TV antwortet, \${Array.isArray(apps) ? apps.length : "?"} Apps\`, "ok");
        }
      };
    });
  }

  async function connect() {
    setStatus("verbinde …");
    try { await openSocket(); } catch (e) { setStatus(e.message, "bad"); }
  }

  // Power: verbunden → Standby. Getrennt → WoL über das Adapter-Plugin, dann warten.
  async function power() {
    if (ws && ws.readyState === 1) return send("KEY_POWER");
    setStatus("wecke TV per WoL …");
    try {
      await ihome.call("network.wake", { id: WAKE_DEVICE });
    } catch (error) {
      return setStatus("Einschalten braucht das network.wake Plugin: " + error.message, "bad");
    }
    for (let i = 1; i <= 12; i++) {
      setStatus(\`TV bootet … \${i * 3}s\`);
      await new Promise(r => setTimeout(r, 3000));
      try { await openSocket(4000); return; } catch { }
    }
    setStatus("TV nicht aufgewacht – WoL im TV aktiviert?", "bad");
  }

  function send(cmd) {
    if (!ws || ws.readyState !== 1) return setStatus("nicht verbunden", "bad");
    ws.send(JSON.stringify({
      method: "ms.remote.control",
      params: { Cmd: "Click", DataOfCmd: cmd, Option: "false", TypeOfRemote: "SendRemoteKey" }
    }));
  }

  document.getElementById("conn").onclick = connect;
  document.getElementById("power").onclick = power;
  document.getElementById("apps").onclick = () => {
    if (!ws || ws.readyState !== 1) return setStatus("nicht verbunden", "bad");
    ws.send(JSON.stringify({ method: "ms.channel.emit", params: { event: "ed.installedApp.get", to: "host" } }));
    setStatus("frage Apps ab …");
  };
  document.querySelectorAll("[data-key]").forEach(b => b.onclick = () => send(b.dataset.key));

  const KEYS = {
    ArrowUp: "KEY_UP", ArrowDown: "KEY_DOWN", ArrowLeft: "KEY_LEFT", ArrowRight: "KEY_RIGHT",
    Enter: "KEY_ENTER", Backspace: "KEY_RETURN", h: "KEY_HOME", m: "KEY_MUTE", "+": "KEY_VOLUMEUP",
    "-": "KEY_VOLUMEDOWN", p: "KEY_PLAYPAUSE", s: "KEY_SOURCE"
  };
  for (let i = 0; i <= 9; i++) KEYS[i] = "KEY_" + i;  // Ziffern = Kanalnummer

    if (e.target.tagName === "INPUT") return;
    const k = KEYS[e.key];
    if (k) { e.preventDefault(); send(k); }
  });

    try {
      const info = await ihome.call("network.info", { id: WAKE_DEVICE });
      if (info && info.host) document.getElementById("host").value = info.host;

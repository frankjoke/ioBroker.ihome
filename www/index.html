		<!-- Apply persisted theme before first paint to avoid a flash -->
		<script>
			(function () {
				try {
					var mode = localStorage.getItem("__VISUAL__:theme");
					mode = mode ? JSON.parse(mode) : "auto";
					var dark;
					if (mode === "dark") {
						dark = true;
					} else if (mode === "light") {
						dark = false;
					} else {
						// Auto: the admin's own theme (same origin), then the OS.
						var admin = localStorage.getItem("App.themeName");
						if (admin && admin !== "auto") {
							dark =
								["dark", "blue", "modernDark"].indexOf(admin) !== -1;
						} else {
							dark = window.matchMedia(
								"(prefers-color-scheme: dark)",
							).matches;
						}
					}
					if (dark) document.documentElement.classList.add("dark");
				} catch (e) {
					/* ignore */
				}
			})();
		</script>

achel-Editor ergänzt eine Wert-/Namens-Ansicht, Regellisten, einen eingebetteten Geräte-Editor und einen getabbten Quellen-Picker mit Variablen und Logik."},"0.1.3":{"en":"Device controls can now correct a badly decorated state: role, type, value labels (states), unit and hide-unit, min/max/step, read/write, room and functions. The correction wins over the broker object and drives the widget choice, value formatting, badges, device list and slot creation. Both selectors filter by room and function (the device picker also by name/control), every slot kind has its own icon, the tile has a separate icon before its name, duplicate control labels are numbered, and deleting a slot or tile asks first.","de":"Geräte-Controls können einen schlecht dekorierten State jetzt korrigieren: Rolle, Typ, Wertelabels (states), Einheit und Einheit ausblenden, Min/Max/Step, Lesen/Schreiben, Raum und Funktionen. Die Korrektur gewinnt über das Broker-Objekt und steuert Widget-Wahl, Wertformatierung, Badges, Geräteliste und Slot-Erzeugung. Beide Auswahlen filtern nach Raum und Funktion (die Geräteauswahl auch nach Name/Control), jeder Slot-Typ hat sein eigenes Icon, die Kachel hat ein eigenes Icon vor ihrem Namen, doppelte Control-Namen werden nummeriert, und das Löschen eines Slots oder einer Kachel fragt vorher nach."},"0.1.2":{"en":"A phone is now a narrow desktop: tiles keep their configured width and height (clamped only to the screen), sections wrap side by side instead of one per line, and the phone module is larger so names and values stop wrapping. HTML/frame slots show their icon and label as a caption above the surface and fill the whole tile, and a phone trims its margins so five 1×1 tiles fit per row from 408 px.","de":"Ein Handy ist jetzt ein schmaler Desktop: Kacheln behalten ihre eingestellte Breite und Höhe (nur auf den Bildschirm begrenzt), Bereiche umbrechen nebeneinander statt einer pro Zeile, und das Handy-Modul ist größer, damit Namen und Werte nicht mehr umbrechen. HTML-/Frame-Slots zeigen Icon und Label als Überschrift über der Fläche und füllen die ganze Kachel; ein Handy spart Ränder, sodass ab 408 px fünf 1×1-Kacheln pro Zeile passen."},"0.1.1":{"en":"HTML slots: a tile can carry a full local HTML document — scripts, styles and same-origin access — inline or from a state, shown on its detail page. {{NAME}} placeholders read Global Variables or raw states, and the document can call ihome.setState/getState/setVariable/getVariable. Includes the usual icon/label basics, slot labels above pages and a light Samsung remote sample.","de":"HTML-Slots: Eine Kachel kann ein vollständiges lokales HTML-Dokument tragen — Skripte, Styles und Same-Origin-Zugriff — inline oder aus einem State, angezeigt auf ihrer Detailseite. {{NAME}}-Platzhalter lesen Globale Variablen oder Roh-States, und das Dokument kann ihome.setState/getState/setVariable/getVariable aufrufen. Enthält die üblichen Icon-/Label-Grundlagen, Slot-Labels über Seiten und ein helles Samsung-Remote-Beispiel."},"0.1.0":{"en":"One picker for every state or control selection: the same modal adds a slot, picks a tile's active source, edits device controls or a variable, and lists the tile's own sources first. The layout editor keeps the selected tile across view/edit, moves tiles and sections through dialogs, reorders pages, and can hide the pencil for everyone. The mobile bar drops the network icon (the cog shows the connection) and page-tab icons on narrow screens; the theme choice now lives in User Interface and stays per browser.","de":"Ein Picker für jede State- oder Control-Auswahl: Dasselbe Fenster legt einen Slot an, wählt die aktive Quelle einer Kachel, bearbeitet Geräte-Controls oder eine Variable und zeigt die Quellen der Kachel zuerst. Der Layout-Editor behält die gewählte Kachel über Ansicht/Editor, verschiebt Kacheln und Bereiche per Dialog, ordnet Seiten um und kann den Stift für alle ausblenden. Die mobile Leiste verliert das Netzwerk-Icon (das Zahnrad zeigt die Verbindung) und auf schmalen Bildschirmen die Seiten-Icons; die Theme-Wahl liegt jetzt unter Benutzeroberfläche und bleibt pro Browser."},"0.0.33":{"en":"Tiles are now built from slots: each slot reads a device control or any raw state, and a tile no longer owns a device. Loading a device adds slots only for its real controls, and existing pages migrate once with a backup (pageListV1).","de":"Kacheln bestehen jetzt aus Slots: Jeder Slot liest ein Geräte-Control oder einen beliebigen Roh-State, und eine Kachel besitzt kein Gerät mehr. Das Laden eines Geräts erzeugt Slots nur für seine tatsächlichen Controls, und vorhandene Seiten werden einmalig mit einer Sicherung (pageListV1) migriert."},"0.0.32":{"en":"Blank tiles: a tile can be added without a device (frames, raw values, badges), a device can be created from the add-tile picker, and a device attaches to a blank tile without losing its layout. The level slider follows the slot's own min/max/step and its thumb reaches both ends of the track.","de":"Leere Kacheln: Eine Kachel kann ohne Gerät angelegt werden (Webseiten, Rohwerte, Badges), ein Gerät lässt sich direkt aus dem Kachel-Picker erzeugen, und ein Gerät hängt sich an eine leere Kachel, ohne deren Layout zu verlieren. Der Level-Slider beachtet min/max/step des Slots und sein Griff erreicht beide Enden der Spur."},"0.0.30":{"en":"Adding a slot from Any state uses the same state picker as changing a source: the full tree with adapter, room, type and role filters, live values and the _Variables group, while the Kind dropdown and the other add-slot tabs stay as they were","de":"Das Hinzufügen eines Slots unter „Any state“ nutzt denselben State-Picker wie das Ändern einer Quelle: den vollständigen Baum mit Adapter-, Raum-, Typ- und Rollenfiltern, Live-Werten und der _Variables-Gruppe, während die Kind-Auswahl und die übrigen Reiter unverändert bleiben"},"0.0.29":{"en":"Changing a slot's source in the tile or device editor now uses the same state picker as a device control: the full state tree with adapter, room, type and role filters and the _Variables group, plus a This device strip for the device's own controls — variables and any state are pickable, and the slot reads the value live","de":"Das Ändern der Quelle eines Slots im Kachel- oder Geräte-Editor nutzt jetzt denselben State-Picker wie ein Geräte-Control: den vollständigen State-Baum mit Adapter-, Raum-, Typ- und Rollenfiltern und der _Variables-Gruppe, dazu eine Leiste „This device“ für die eigenen Controls des Geräts — Variablen und jeder State sind wählbar, und der Slot liest den Wert live"},"0.0.28":{"en":"A slot added in the tile editor from Any state now shows its live value right away, and after a reload: the state behind a raw slot is subscribed and fetched like a device control (it used to stay “—” until the same state was also added to the device)","de":"Ein im Kachel-Editor unter „Any state“ hinzugefügter Slot zeigt seinen Live-Wert jetzt sofort und auch nach einem Neuladen: Der State hinter einem rohen Slot wird wie ein Geräte-Control abonniert und gelesen (bisher blieb er bei „—“ , bis derselbe State auch am Gerät hing)"}},"titleLang":{"en":"iHome","de":"iHome","ru":"iHome","pt":"iHome","nl":"iHome","fr":"iHome","it":"iHome","es":"iHome","pl":"iHome","uk":"iHome","zh-cn":"iHome"},"desc":{"en":"iHome — dashboard adapter for ioBroker home automation with Svelte SPA","de":"iHome — Dashboard-Adapter für ioBroker Smart Home mit Svelte SPA","ru":"Адаптер визуального интерфейса для ioBroker умного дома с Svelte SPA","pt":"Adaptador de interface visual para automação residencial ioBroker com Svelte SPA","nl":"Visuele interface-adapter voor ioBroker thuisautomatisering met Svelte SPA","fr":"Adaptateur d'interface visuelle pour l'automatisation domiciliaire ioBroker avec Svelte SPA","it":"Adattatore di interfaccia visiva per l'automazione domestica ioBroker con Svelte SPA","es":"Adaptador de interfaz visual para automatización del hogar ioBroker con Svelte SPA","pl":"Adapter interfejsu wizualnego dla automatyki domowej ioBroker z Svelte SPA","uk":"Адаптер візуального інтерфейсу для автоматизаціїбудинку ioBroker з Svelte SPA","zh-cn":"用于ioBroker家庭自动化的Svelte SPA可视化界面适配器"},"authors":["Frank Joke <frankjoke@hotmail.com>"],"keywords":["ioBroker","ihome","dashboard","home","automation","SPA","PWA","Svelte","dashboard","control"],"licenseInformation":{"type":"free","license":"MIT"},"main":"build/main.js","platform":"Javascript/Node.js","icon":"ihome.png","enabled":true,"extIcon":"https://raw.githubusercontent.com/frankjoke/ioBroker.ihome/main/admin/ihome.png","readme":"https://github.com/frankjoke/ioBroker.ihome/blob/main/README.md","loglevel":"info","tier":3,"mode":"daemon","type":"general","compact":false,"logTransporter":true,"singleton":true,"adminUI":{"config":"none"},"localLinks":{"ihome":{"link":"%web_protocol%://%ip%:%web_port%/ihome/index.html","name":{"en":"iHome dashboard","de":"iHome Dashboard","ru":"iHome","pt":"Painel iHome","nl":"iHome dashboard","fr":"Tableau de bord iHome","it":"Dashboard iHome","es":"Panel iHome","pl":"Panel iHome","uk":"Панель iHome","zh-cn":"iHome 面板"},"icon":"adapter/ihome/ihome.png","color":"#1e88e5","order":0}},"supportCustoms":true,"dependencies":[{"js-controller":">=6.0.11"}],"globalDependencies":[{"admin":">=7.0.23"}]}`)};var aN=w('<p class="conn-note svelte-o3ewq8"><span class="badge badge-success">connected</span> <span class="text-muted"> </span></p>'),rN=w('<p class="text-danger hint svelte-o3ewq8">Not saved — ioBroker unreachable.</p>'),iN=w(`<div class="server-page svelte-o3ewq8"><div class="page-header svelte-o3ewq8"><h1 class="svelte-o3ewq8">Server &amp; Security</h1></div> <fieldset class="lock-zone svelte-o3ewq8"><section class="card settings-card svelte-o3ewq8"><div class="card-header svelte-o3ewq8"><span class="material-symbols-outlined svelte-o3ewq8">lan</span> <h2 class="card-title">Connection</h2></div> <div class="card-body settings-card-body svelte-o3ewq8"><div class="field s

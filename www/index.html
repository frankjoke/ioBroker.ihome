		<!-- Apply persisted theme before first paint to avoid a flash -->
		<script>
			(function () {
				try {
					var mode = localStorage.getItem("__VISUAL__:theme");
					mode = mode ? JSON.parse(mode) : "auto";
					var dark;
					if (mode === "dark") {
						dark = true;
					} else if (mode === "light") {
						dark = false;
					} else {
						// Auto: the admin's own theme (same origin), then the OS.
						var admin = localStorage.getItem("App.themeName");
						if (admin && admin !== "auto") {
							dark =
								["dark", "blue", "modernDark"].indexOf(admin) !== -1;
						} else {
							dark = window.matchMedia(
								"(prefers-color-scheme: dark)",
							).matches;
						}
					}
					if (dark) document.documentElement.classList.add("dark");
				} catch (e) {
					/* ignore */
				}
			})();
		</script>

ice picker also by name/control), every slot kind has its own icon, the tile has a separate icon before its name, duplicate control labels are numbered, and deleting a slot or tile asks first.","de":"Geräte-Controls können einen schlecht dekorierten State jetzt korrigieren: Rolle, Typ, Wertelabels (states), Einheit und Einheit ausblenden, Min/Max/Step, Lesen/Schreiben, Raum und Funktionen. Die Korrektur gewinnt über das Broker-Objekt und steuert Widget-Wahl, Wertformatierung, Badges, Geräteliste und Slot-Erzeugung. Beide Auswahlen filtern nach Raum und Funktion (die Geräteauswahl auch nach Name/Control), jeder Slot-Typ hat sein eigenes Icon, die Kachel hat ein eigenes Icon vor ihrem Namen, doppelte Control-Namen werden nummeriert, und das Löschen eines Slots oder einer Kachel fragt vorher nach."},"0.1.2":{"en":"A phone is now a narrow desktop: tiles keep their configured width and height (clamped only to the screen), sections wrap side by side instead of one per line, and the phone module is larger so names and values stop wrapping. HTML/frame slots show their icon and label as a caption above the surface and fill the whole tile, and a phone trims its margins so five 1×1 tiles fit per row from 408 px.","de":"Ein Handy ist jetzt ein schmaler Desktop: Kacheln behalten ihre eingestellte Breite und Höhe (nur auf den Bildschirm begrenzt), Bereiche umbrechen nebeneinander statt einer pro Zeile, und das Handy-Modul ist größer, damit Namen und Werte nicht mehr umbrechen. HTML-/Frame-Slots zeigen Icon und Label als Überschrift über der Fläche und füllen die ganze Kachel; ein Handy spart Ränder, sodass ab 408 px fünf 1×1-Kacheln pro Zeile passen."},"0.1.1":{"en":"HTML slots: a tile can carry a full local HTML document — scripts, styles and same-origin access — inline or from a state, shown on its detail page. {{NAME}} placeholders read Global Variables or raw states, and the document can call ihome.setState/getState/setVariable/getVariable. Includes the usual icon/label basics, slot labels above pages and a light Samsung remote sample.","de":"HTML-Slots: Eine Kachel kann ein vollständiges lokales HTML-Dokument tragen — Skripte, Styles und Same-Origin-Zugriff — inline oder aus einem State, angezeigt auf ihrer Detailseite. {{NAME}}-Platzhalter lesen Globale Variablen oder Roh-States, und das Dokument kann ihome.setState/getState/setVariable/getVariable aufrufen. Enthält die üblichen Icon-/Label-Grundlagen, Slot-Labels über Seiten und ein helles Samsung-Remote-Beispiel."},"0.1.0":{"en":"One picker for every state or control selection: the same modal adds a slot, picks a tile's active source, edits device controls or a variable, and lists the tile's own sources first. The layout editor keeps the selected tile across view/edit, moves tiles and sections through dialogs, reorders pages, and can hide the pencil for everyone. The mobile bar drops the network icon (the cog shows the connection) and page-tab icons on narrow screens; the theme choice now lives in User Interface and stays per browser.","de":"Ein Picker für jede State- oder Control-Auswahl: Dasselbe Fenster legt einen Slot an, wählt die aktive Quelle einer Kachel, bearbeitet Geräte-Controls oder eine Variable und zeigt die Quellen der Kachel zuerst. Der Layout-Editor behält die gewählte Kachel über Ansicht/Editor, verschiebt Kacheln und Bereiche per Dialog, ordnet Seiten um und kann den Stift für alle ausblenden. Die mobile Leiste verliert das Netzwerk-Icon (das Zahnrad zeigt die Verbindung) und auf schmalen Bildschirmen die Seiten-Icons; die Theme-Wahl liegt jetzt unter Benutzeroberfläche und bleibt pro Browser."},"0.0.33":{"en":"Tiles are now built from slots: each slot reads a device control or any raw state, and a tile no longer owns a device. Loading a device adds slots only for its real controls, and existing pages migrate once with a backup (pageListV1).","de":"Kacheln bestehen jetzt aus Slots: Jeder Slot liest ein Geräte-Control oder einen beliebigen Roh-State, und eine Kachel besitzt kein Gerät mehr. Das Laden eines Geräts erzeugt Slots nur für seine tatsächlichen Controls, und vorhandene Seiten werden einmalig mit einer Sicherung (pageListV1) migriert."},"0.0.32":{"en":"Blank tiles: a tile can be added without a device (frames, raw values, badges), a device can be created from the add-tile picker, and a device attaches to a blank tile without losing its layout. The level slider follows the slot's own min/max/step and its thumb reaches both ends of the track.","de":"Leere Kacheln: Eine Kachel kann ohne Gerät angelegt werden (Webseiten, Rohwerte, Badges), ein Gerät lässt sich direkt aus dem Kachel-Picker erzeugen, und ein Gerät hängt sich an eine leere Kachel, ohne deren Layout zu verlieren. Der Level-Slider beachtet min/max/step des Slots und sein Griff erreicht beide Enden der Spur."},"0.0.30":{"en":"Adding a slot from Any state uses the same state picker as changing a source: the full tree with adapter, room, type and role filters, live values and the _Variables group, while the Kind dropdown and the other add-slot tabs stay as they were","de":"Das Hinzufügen eines Slots unter „Any state“ nutzt denselben State-Picker wie das Ändern einer Quelle: den vollständigen Baum mit Adapter-, Raum-, Typ- und Rollenfiltern, Live-Werten und der _Variables-Gruppe, während die Kind-Auswahl und die übrigen Reiter unverändert bleiben"},"0.0.29":{"en":"Changing a slot's source in the tile or device editor now uses the same state picker as a device control: the full state tree with adapter, room, type and role filters and the _Variables group, plus a This device strip for the device's own controls — variables and any state are pickable, and the slot reads the value live","de":"Das Ändern der Quelle eines Slots im Kachel- oder Geräte-Editor nutzt jetzt denselben State-Picker wie ein Geräte-Control: den vollständigen State-Baum mit Adapter-, Raum-, Typ- und Rollenfiltern und der _Variables-Gruppe, dazu eine Leiste „This device“ für die eigenen Controls des Geräts — Variablen und jeder State sind wählbar, und der Slot liest den Wert live"},"0.0.28":{"en":"A slot added in the tile editor from Any state now shows its live value right away, and after a reload: the state behind a raw slot is subscribed and fetched like a device control (it used to stay “—” until the same state was also added to the device)","de":"Ein im Kachel-Editor unter „Any state“ hinzugefügter Slot zeigt seinen Live-Wert jetzt sofort und auch nach einem Neuladen: Der State hinter einem rohen Slot wird wie ein Geräte-Control abonniert und gelesen (bisher blieb er bei „—“ , bis derselbe State auch am Gerät hing)"},"0.0.27":{"en":"A device's icon ignores page and adapter logos on its state's path (the 0_userdata page icon, the iHome adapter icon): when nothing on that path carries a real icon, the device type's glyph is used — the same one the tile look and the slots show (device_thermostat for a Thermometer, touch_app for a Button)","de":"Das Icon eines Geräts ignoriert Seiten- und Adapter-Logos auf dem Pfad seines States (das 0_userdata-Seitenicon, das iHome-Adaptericon): Trägt nichts auf diesem Pfad ein echtes Icon, wird das Glyph des Gerätetyps verwendet — dasselbe, das Look und Slots zeigen (device_thermostat für ein Thermometer, touch_app für einen Button)"},"0.0.26":{"en":"A device created from a variable now shows its type's icon — the same glyph the tile's look shows (touch_app for a Button, lightbulb for a Light) — instead of the adapter logo when the state has no icon of its own. A press button writes true and releases the state to false after 300 ms, so momentary button states no longer stick on","de":"Ein aus einer Variable erzeugtes Gerät zeigt jetzt das Icon seines Typs — dasselbe Glyph wie im Look der Kachel (touch_app für einen Button, lightbulb für ein Licht) — statt des Adapter-Logos, wenn der State kein eigenes Icon hat. Eine Drucktaste schreibt true und setzt den State nach 300 ms wieder auf false, sodass momentane Tastenzustände nicht mehr hängen bleiben"},"0.0.25":{"en":"A control's feature is kept in line with its device type: a device created from a state now gets the feature its final type defines (a Button gets press, not the generic boolean power), and existing controls with a feature the type does not have are repaired on load — the affected button tiles render again. A device also inherits the room and the adapter icon from the variable's state","de":"Das Feature eines Controls bleibt mit dem Gerätetyp im Einklang: Ein aus einem State erzeugtes Gerät bekommt das Feature seines endgültigen Typs (ein Button erhält press, nicht das generische Boolean-power), und vorhandene Controls mit einem Feature, das der Typ nicht kennt, werden beim Laden repariert — die betroffenen Button-Kacheln erscheinen wieder. Ein Gerät übernimmt außerdem Raum und Adapter-Icon vom State der Variable"},"0.0.24":{"en":"The state picker always opens with an empty search, showing the full state tree; it no longer prefills the control's current state or the new device's name (the adapter/room/type/role filters are still remembered)","de":"Der State-Picker öffnet immer mit leerer Suche und zeigt den vollständigen State-Baum; er füllt weder den aktuellen State des Controls noch den Namen des neuen Geräts vor (Adapter-/Raum-/Typ-/Rollenfilter bleiben gemerkt)"},"0.0.23":{"en":"Editing a device opens the form directly under its row — highlighted and scrolled into view — instead of at the top of the page; new devices still use the top form. The tile editor's device action is now Replace this tile's device: it never deletes the device, Cancel changes nothing, and deleting a device on the Devices page removes its tiles and says how many","de":"Das Bearbeiten eines Geräts öffnet das Formular direkt unter seiner Zeile — hervorgehoben und in den Blick gescrollt — statt oben auf der Seite; neue Geräte nutzen weiter das Formular oben. Die Geräte-Aktion im Kachel-Editor heißt jetzt „Replace this tile's device“: Sie löscht nie das Gerät, Abbrechen ändert nichts, und das Löschen eines Geräts auf der Geräte-Seite entfernt seine Kacheln und nennt deren Anzahl"},"0.0.22":{"en":"Global state variables appear in the state picker as the first _Variables group: pick one and the control stores the variable name — shown as the state — while role, unit, writability and the room/type suggestion come from the real state behind it","de":"Globale Zustandsvariablen erscheinen im State-Picker als erste Gruppe _Variables: Wählt man eine, speichert das Control den Variablennamen — angezeigt als State —, während Rolle, Einheit, Schreibbarkeit sowie Raum-/Typ-Vorschlag vom dahinterliegenden echten State kommen"},"0.0.21":{"en":"Page links are readable: a new page's address is the slug of its name (#/p/wohnzimmer) instead of a random id; pages created before this update are renamed once, and the link stays as created when the page is renamed later","de":"Seitenlinks sind lesbar: Die Adresse einer neuen Seite ist der Slug ihres Namens (#/p/wohnzimmer) statt einer Zufalls-ID; vor diesem Update angelegte Seiten werden einmalig umbenannt, und der Link bleibt beim späteren Umbenennen der Seite erhalten"},"0.0.20":{"en":"New pages and sections ask for a name before they are created: a duplicate name is refused, Cancel creates nothing, and the new page or section is selected right away — no more silent rooms and sections behind the current one","de":"Neue Seiten und Abschnitte fragen vor dem Anlegen nach einem Namen: ein doppelter Name wird abgelehnt, Abbrechen legt nichts an, und die neue Seite bzw. der neue Abschnitt ist sofort ausgewählt — keine stillen Seiten und Abschnitte mehr hinter der aktuellen"},"0.0.19":{"en":"A User Interface page (the first cog page in a session) sets the installation's defaults: page, section and tile background colours, the tile name and value text sizes, and the 1×1 tile scale up to 200 % — shared by every device; the cog returns to the last config page a tab visited","de":"Eine Seite „User Interface“ (die erste Zahnrad-Seite einer Sitzung) legt die Standardwerte der Installation fest: Hintergrundfarben für Seite, Abschnitt und Tile, die Textgrößen von Tile-Name und -Wert sowie die Größe eines 1×1-Tiles bis 200 % — geteilt von allen Geräten; das Zahnrad kehrt zur zuletzt besuchten Konfigurationsseite eines Tabs zurück"},"0.0.18":{"en":"The PIN and the layout editor's lock are shared settings now: they live in ihome.0.config.settings, a missing PIN is seeded there as the default 4321, and every device follows a change. The pencil lock ships off, so the layout editor stays quick during installation, while every configuration page still requires the PIN","de":"PIN und Sperre des Layout-Editors sind jetzt geteilte Einstellungen: Sie liegen in ihome.0.config.settings, eine fehlende PIN wird dort als Standard 4321 angelegt, und jedes Gerät folgt einer Änderung. Die Stift-Sperre ist standardmäßig aus, damit der Layout-Editor bei der Installation schnell bleibt, während jede Konfigurationsseite weiterhin die PIN verlangt"},"0.0.17":{"en":"Global variables now act as an alias inside the app: a variable name can stand where a state id is named — a device control, a rule, a formula — and reading, subscribing and writing all go to the state behind it, so pointing a variable at another state updates every use without touching them. Names are the reference and are restricted (no dots or spaces), duplicates and reserved names (sum, get, active, …) are refused, and a state created from the variable list can carry a role, min/max/step and room/function membership","de":"Globale Variablen wirken jetzt als Alias innerhalb der App: Ein Variablenname kann dort stehen, wo ein State genannt wird — bei Geräte-Controls, Regeln, Formeln — und Lesen, Abonnieren und Schreiben gehen an den dahinterliegenden State; zeigt eine Variable auf einen anderen State, folgen alle Verwendungen, ohne sie anzufassen. Namen sind die Referenz und eingeschränkt (keine Punkte oder Leerzeichen), Doppelungen und reservierte Namen (sum, get, active, …) werden abgelehnt, und ein aus der Variablenliste angelegter State kann Rolle, Min/Max/Step sowie Raum-/Funktions-Zuordnung tragen"}},"titleLang":{"en":"iHome","de":"iHome","ru":"iHome","pt":"iHome","nl":"iHome","fr":"iHome","it":"iHome","es":"iHome","pl":"iHome","uk":"iHome","zh-cn":"iHome"},"desc":{"en":"iHome — dashboard adapter for ioBroker home automation with Svelte SPA","de":"iHome — Dashboard-Adapter für ioBroker Smart Home mit Svelte SPA","ru":"Адаптер визуального интерфейса для ioBroker умного дома с Svelte SPA","pt":"Adaptador de interface visual para automação residencial ioBroker com Svelte SPA","nl":"Visuele interface-adapter voor ioBroker thuisautomatisering met Svelte SPA","fr":"Adaptateur d'interface visuelle pour l'automatisation domiciliaire ioBroker avec Svelte SPA","it":"Adattatore di interfaccia visiva per l'automazione domestica ioBroker con Svelte SPA","es":"Adaptador de interfaz visual para automatización del hogar ioBroker con Svelte SPA","pl":"Adapter interfejsu wizualnego dla automatyki domowej ioBroker z Svelte SPA","uk":"Адаптер візуального інтерфейсу для автоматизаціїбудинку ioBroker з Svelte SPA","zh-cn":"用于ioBroker家庭自动化的Svelte SPA可视化界面适配器"},"authors":["Frank Joke <frankjoke@hotmail.com>"],"keywords":["ioBroker","ihome","dashboard","home","automation","SPA","PWA","Svelte","dashboard","control"],"licenseInformation":{"type":"free","license":"MIT"},"main":"build/main.js","platform":"Javascript/Node.js","icon":"ihome.png","enabled":true,"extIcon":"https://raw.githubusercontent.com/frankjoke/ioBroker.ihome/main/admin/ihome.png","readme":"https://github.com/frankjoke/ioBroker.ihome/blob/main/README.md","loglevel":"info","tier":3,"mode":"daemon","type":"general","compact":false,"singleton":true,"adminUI":{"config":"none"},"localLinks":{"ihome":{"link":"%web_protocol%://%ip%:%web_port%/ihome/index.html","name":{"en":"iHome dashboard","de":"iHome Dashboard","ru":"iHome","pt":"Painel

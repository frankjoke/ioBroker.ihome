<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iHome Adapter Settings</title>
    <link rel="stylesheet" href="/vis.0/css/lib.css">
    <link rel="stylesheet" href="/vis.0/css/materialize.css">
    <link rel="stylesheet" href="/vis.0/css/icons-material.css">
    <link rel="stylesheet" href="/vis.0/css/mdi.css">
    <link rel="stylesheet" href="/vis.0/css/vis.css">
    <style>
        .config-container {
            padding: 20px;
        }
        .config-row {
            margin-bottom: 20px;
        }
        .config-label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .config-input {
            width: 100%;
            max-width: 300px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .config-select {
            width: 100%;
            max-width: 300px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="config-container">
        <h2>iHome Adapter Configuration</h2>
        
        <div class="config-row">
            <label class="config-label" for="ihome.port">Port:</label>
            <input type="number" id="ihome.port" class="config-input" min="1" max="65535" value="8082">
            <span class="input-note">Port for the iHome web server (default: 8082)</span>
        </div>
        
        <div class="config-row">
            <label class="config-label" for="ihome.theme">Theme:</label>
            <select id="ihome.theme" class="config-select">
                <option value="light">Light</option>
                <option value="dark">Dark</option>
            </select>
            <span class="input-note">Visual theme for the interface</span>
        </div>
        
        <div class="config-row">
            <label class="config-label" for="ihome.refreshInterval">Refresh Interval:</label>
            <input type="number" id="ihome.refreshInterval" class="config-input" min="1" max="60" value="5">
            <span class="input-note">Refresh interval in seconds (default: 5)</span>
        </div>
        
        <div class="config-row">
            <button type="button" onclick="saveConfig()" class="btn btn-primary">Save Configuration</button>
        </div>
    </div>

    <script>
        function saveConfig() {
            const config = {
                port: document.getElementById('ihome.port').value,
                theme: document.getElementById('ihome.theme').value,
                refreshInterval: document.getElementById('ihome.refreshInterval').value
            };
            
            // Send configuration to adapter
            if (socket && socket.connected) {
                socket.emit('setObject', {
                    _id: 'ihome.0.config',
                    type: 'state',
                    common: {
                        name: 'Adapter configuration',
                        type: 'object',
                        role: 'config'
                    },
                    native: {},
                    val: config
                }, () => {
                    alert('Configuration saved successfully!');
                });
            }
        }

        // Initialize socket connection
        const socket = io();
        socket.on('connect', () => {
            console.log('Connected to ioBroker');
            // Load current configuration
            socket.emit('getObject', 'ihome.0.config', (err, obj) => {
                if (!err && obj && obj.val) {
                    document.getElementById('ihome.port').value = obj.val.port || 8082;
                    document.getElementById('ihome.theme').value = obj.val.theme || 'light';
                    document.getElementById('ihome.refreshInterval').value = obj.val.refreshInterval || 5;
                }
            });
        });
    </script>
</body>
</html>

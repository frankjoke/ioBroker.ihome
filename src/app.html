<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="icon" type="image/png" sizes="64x64" href="%sveltekit.assets%/favicon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon.ico" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<meta name="theme-color" content="#0f131c" />
		<meta name="description" content="Visual interface for ioBroker smart home control" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=JetBrains+Mono:wght@100..800&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
			rel="stylesheet"
		/>

		<!-- Apply persisted theme before first paint to avoid a flash -->
		<script>
			(function () {
				try {
					var mode = localStorage.getItem("__VISUAL__:theme");
					mode = mode ? JSON.parse(mode) : "auto";
					var dark;
					if (mode === "dark") {
						dark = true;
					} else if (mode === "light") {
						dark = false;
					} else {
						// Auto: the admin's own theme (same origin), then the OS.
						var admin = localStorage.getItem("App.themeName");
						if (admin && admin !== "auto") {
							dark =
								["dark", "blue", "modernDark"].indexOf(admin) !== -1;
						} else {
							dark = window.matchMedia(
								"(prefers-color-scheme: dark)",
							).matches;
						}
					}
					if (dark) document.documentElement.classList.add("dark");
				} catch (e) {
					/* ignore */
				}
			})();
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
